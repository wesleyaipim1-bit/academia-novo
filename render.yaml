services:
  - type: web
    name: fitmax
    runtime: node
    buildCommand: npm ci && npm run db:generate && npm run db:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitmax-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
      - key: VITE_API_BASE
        value: /api

databases:
  - name: fitmax-db
    databaseName: fitmax
    user: fitmax
